apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.component_name }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: ${{ values.repo_owner }}/${{ values.repo_name }}
    backstage.io/kubernetes-label-selector: 'core.choreo.dev/component=${{ values.component_name }},core.choreo.dev/organization=default-org,core.choreo.dev/project=${{ values.project_name }}'
  links:
    - url: https://github.com/${{ values.repo_owner }}/${{ values.repo_name }}
      title: GitHub Repo
      icon: github
    - url: https://github.com/openchoreo/openchoreo
      title: OpenChoreo
      icon: web
  tags:
    - go
    - openchoreo

spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: ${{ values.project_name }}
  providesApis:
    - ${{ values.component_name }}-api

---

apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.component_name }}-api
  description: ${{ values.description }}
  links:
    - url: https://github.com/${{ values.repo_owner }}/${{ values.repo_name }}
      title: GitHub Repo
      icon: github
    - url: https://github.com/openchoreo/openchoreo
      title: OpenChoreo
      icon: web
spec:
  type: openapi
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: ${{ values.project_name }}
  definition: |
    openapi: 3.0.1
    info:
      title: Reading List
      description: This is a service that manages a list of reading items.
      contact: {}
      version: "1.0"
    servers:
    - url: http://localhost:8080/reading-list
    paths:
      /books:
        get:
          tags:
          - books
          summary: List all the reading list books
          responses:
            "200":
              description: successful operation
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/models.Book'
        post:
          tags:
          - books
          summary: Add a new book to the reading list
          requestBody:
            description: New book details
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/models.Book'
            required: true
          responses:
            "201":
              description: successful operation
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/models.Book'
            "400":
              description: invalid book details
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/utils.ErrorResponse'
            "409":
              description: book already exists
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/utils.ErrorResponse'
          x-codegen-request-body-name: request
      /books/{id}:
        get:
          tags:
          - books
          summary: Get reading list book by id
          parameters:
          - name: id
            in: path
            description: Book ID
            required: true
            schema:
              type: string
          responses:
            "200":
              description: successful operation
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/models.Book'
            "404":
              description: book not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/utils.ErrorResponse'
        put:
          tags:
          - books
          summary: Update a reading list book by id
          parameters:
          - name: id
            in: path
            description: Book ID
            required: true
            schema:
              type: string
          requestBody:
            description: Updated book details
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/models.Book'
            required: true
          responses:
            "200":
              description: successful operation
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/models.Book'
            "400":
              description: invalid book details
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/utils.ErrorResponse'
            "404":
              description: book not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/utils.ErrorResponse'
          x-codegen-request-body-name: request
        delete:
          tags:
          - books
          summary: Delete a reading list book by id
          parameters:
          - name: id
            in: path
            description: Book ID
            required: true
            schema:
              type: string
          responses:
            "200":
              description: successful operation
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/models.Book'
            "404":
              description: book not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/utils.ErrorResponse'
    components:
      schemas:
        models.Book:
          type: object
          properties:
            author:
              type: string
              example: J. R. R. Tolkien
            id:
              type: string
              example: fe2594d0-ccea-42a2-97ac-0487458b5642
            status:
              type: object
              example: to_read
              allOf:
              - $ref: '#/components/schemas/models.ReadStatus'
            title:
              type: string
              example: The Lord of the Rings
        models.ReadStatus:
          type: string
          enum:
          - to_read
          - reading
          - read
          x-enum-varnames:
          - ReadStatusToRead
          - ReadStatusReading
          - ReadStatusRead
        utils.ErrorResponse:
          type: object
          properties:
            message:
              type: string
              example: error message

