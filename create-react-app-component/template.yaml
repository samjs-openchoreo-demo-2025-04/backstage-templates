apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-react-app-template
  title: Create React App Component
  description: Create a new CRA website project
  tags:
    - react
    - cra
    - openchoreo
spec:
  owner: guests
  type: website
  parameters:
    - title: Provide some simple information
      required:
        - component_name
        - owner
        - project_name
      properties:
        component_name:
          title: Component Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Help others understand what this website is for.
        project_name:
          title: Project Name
          type: string
          description: Name of the project
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Group
                spec.type: team
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutRender:
          - .github/workflows/*
        values:
          component_name: ${{ parameters.component_name }}
          description: ${{ parameters.description }}
          destination: ${{ parameters.repoUrl }}
          owner: ${{ parameters.owner }}
          project_name: ${{ parameters.project_name.split('/')[1] }}
          repo_owner: ${{ parameters.repoUrl.split('owner=')[1].split('&')[0] }}
          repo_name: ${{ parameters.repoUrl.split('repo=')[1] }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: This is ${{ parameters.component_name }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: false
        gitAuthorName: ${{ user.entity.metadata.name }}
        gitAuthorEmail: sameera.madushan@gmail.com

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}